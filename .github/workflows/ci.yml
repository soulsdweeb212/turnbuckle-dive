# Continuous integration (CI): after every push and for every pull request, GitHub builds Turnbuckle Dive on a Linux
# machine and on a Windows machine, runs the tests, and opens hello's window to check its picture. The results are on
# the repository's Actions tab. docs/CI.md explains in plain words how this works, what every step does, how to run the
# same steps on your own computer, and how to add to it.
#
# Each job uses the same CMake presets as a local build (CMakePresets.json), so "what CI does" and "what you type" are
# the same commands.

name: CI

on:
  push:
  pull_request:
  # Adds a "Run workflow" button on the Actions tab, to start a run by hand.
  workflow_dispatch:

# The jobs only need to read the code.
permissions:
  contents: read

# When a branch gets a newer push, the run still going for the older one is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Get the code, with the LibUltraShip submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install the tools and libraries
        # The first line is the same list as in README.md; keep the two the same. xvfb (a virtual screen) and
        # libgl1-mesa-dri (Mesa's software renderer) let hello open its window on a machine without a screen.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gdb cmake ninja-build pkg-config libpng-dev libglew-dev libgl-dev libegl-dev libgles-dev libzip-dev zipcmp zipmerge ziptool nlohmann-json3-dev libtinyxml2-dev libspdlog-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libpulse-dev libasound2-dev libudev-dev libdbus-1-dev
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Configure (preset "debug")
        # Also downloads SDL3, ImGui and LibUltraShip's small libraries, and applies cmake/patches/libultraship.
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Run the tests
        run: ctest --preset debug

      - name: Check hello's picture
        # xvfb-run gives hello a virtual screen, where Mesa draws on the CPU. --check reads the picture back after the
        # third frame and makes hello exit with code 2 if the picture is wrong (its corner markers or its test shapes,
        # described at the top of hello/main.cpp); in --check runs a crash ends hello at once. The machine has no sound
        # card, so SDL's "dummy" sound driver is used. timeout stops a hung run after 2 minutes (exit code 124).
        working-directory: build/debug
        env:
          SDL_AUDIODRIVER: dummy
        run: timeout 120 xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" ./hello --check --frames 30

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Get the code, with the LibUltraShip submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore the libraries vcpkg built in earlier runs
        # On Windows, LibUltraShip gets SDL3, GLEW, zlib, bzip2, libzip, nlohmann-json, tinyxml2 and spdlog through
        # vcpkg, which builds them from source and keeps a zip of each in the folder below. Restoring those zips from the
        # last run lets vcpkg skip the builds. They are saved again right after Configure.
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vcpkg-archives-

      - name: Set up Visual Studio's compiler (cl) for 64-bit Windows
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (preset "windows-relwithdebinfo")
        # The first time, this downloads vcpkg into build/_vcpkg, then vcpkg builds or restores the libraries above.
        run: cmake --preset windows-relwithdebinfo

      - name: Save the libraries vcpkg built
        # if: always() makes this step run even when Configure failed or the run was cancelled, because vcpkg may
        # already have built some libraries. Build and the tests come after it, so they cannot stop the save.
        # continue-on-error: if Configure stopped before vcpkg ran, there is nothing to save, and the job goes on to
        # report that failure.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build
        run: cmake --build --preset windows-relwithdebinfo

      - name: Run the tests
        run: ctest --preset windows-relwithdebinfo

      - name: Check hello's picture
        # Same check as on Linux; here hello draws with Direct3D 11 (Windows' software renderer on this machine). Some
        # LibUltraShip errors open a message box that nobody can close here, so the step is stopped after 2 minutes.
        working-directory: build/windows-relwithdebinfo
        timeout-minutes: 2
        run: .\hello.exe --check --frames 30

      - name: Show LibUltraShip's log (only when a step failed)
        # On Windows, LibUltraShip writes its messages to this file next to hello rather than to the step's output.
        if: failure()
        working-directory: build/windows-relwithdebinfo
        run: if (Test-Path logs/hello.log) { Get-Content logs/hello.log -Tail 200 }
